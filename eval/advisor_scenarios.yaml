# The four report scenarios, run through the real advisor (harness/advisor.py).
# `request.text` is what the student types; `request.constraints` is the same request
# written as a RepairRequest, used to score the answer and to get the solver's minimum.
# Placement ids are course codes without spaces, lowercased (cs4701).

- id: adv-1-lighter-spring
  program: cs-eng
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  # a typical Engineering CS history: both writing seminars, ENGRI and some liberal
  # studies done, so onboarding seeds the usual open slots and terms start near 15 credits
  history: &history
    FA24: [CS 1110, MATH 1910, CHEM 2090, ENGL 1105]
    SP25: [CS 2110, MATH 1920, PHYS 1112, ENGL 1111, ENGRI 1101]
    FA25: [CS 2800, MATH 2940, PHYS 2213, ECON 1110]
    SP26: [CS 3110, ENGRD 2700, PSYCH 1101, PHIL 1100]
    FA26: [CS 3780, CS 4820, ORIE 3300, GOVT 1111]
  plan:
    SP27: [CS 3410, CS 4740, CS 4780]
    FA27: [CS 4410, CS 4320, ORIE 3500]
    SP28: [CS 4701]
  request:
    text: Can you make Spring '27 12 credits at most?
    constraints: {term_caps: {SP27: 12}}
  expected:
    outcome: feasible

- id: adv-2-drop-prereq
  program: cs-eng
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  history: *history
  plan:
    SP27: [CS 3410, CS 4740]
    FA27: [CS 4410]
  request:
    text: I want to drop CS 3410.
    constraints: {remove: [cs3410]}
  expected:
    outcome: infeasible
    notes: >-
      CS 4410 needs CS 3410 or CS 3420, and CS 3420 needs ECE/ENGRD 2300, which isn't in
      the plan. The honest answer is that CS 3410 can't simply go.

