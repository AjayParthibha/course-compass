  program: cs-eng
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  history: *history
  plan:
    SP27: [CS 3410, CS 4740, CS 4320]
    FA27: [CS 4410, CS 4701, ORIE 3500]
    SP28: [CS 4780]
  request:
    text: Can I graduate a semester early, in Fall '27, and keep every semester at 15 credits or less?
    constraints: {graduate_by: FA27, term_caps: {SP27: 15, FA27: 15}}
  expected:
    outcome: infeasible
    notes: The remaining courses and requirement slots don't fit in two 15-credit terms.

