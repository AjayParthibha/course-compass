# Arts & Sciences (B.A.) scenarios. A typical A&S CS history: the B.A. math (MATH 1110,
# 1120, 2210), both writing seminars, the language done with SPAN 2090, and nine of the
# ten distribution categories (ARTH 1100 covers ALC and HST, GOVT 1503 brings GLC); only
# social difference (SCD) is left. `ops` is the literal edit for validate and model mode,
# `constraints` the same request for repair_global and rebuild. Placement ids are course
# codes without spaces, lowercased (cs4701).

- id: as-001-move-practicum
  split: dev
  program: cs-as
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  max_credits: 18
  history: &as_history
    FA24: [CS 1110, MATH 1110, ENGL 1105, ECON 1110]
    SP25: [CS 2110, MATH 1120, ENGL 1111, PHIL 1100]
    FA25: [CS 2800, MATH 2210, SPAN 2090, ARTH 1100]
    SP26: [CS 3110, CS 3780, CHEM 2070, BIOEE 1610]
    FA26: [CS 4820, CS 4320, GOVT 1503, PMA 2300]
  plan: &as_plan
    SP27: [CS 3410, CS 4740]
    FA27: [CS 4701]
    SP28: [CS 4410]
  request:
    text: Push CS 4701 to my last spring.
    ops:
      - {op: move, course: CS 4701, term: SP28}
    constraints: {move: {cs4701: SP28}}
  expected:
    outcome: feasible
    notes: CS 4701 runs every term and its prerequisite (CS 3780) is done.

- id: as-002-drop-prereq
  split: dev
  program: cs-as
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  max_credits: 18
  history: *as_history
  plan: *as_plan
  request:
    text: I want to drop CS 3410.
    ops:
      - {op: remove, course: CS 3410}
    constraints: {remove: [cs3410]}
  expected:
    outcome: infeasible
    notes: >-
      CS 3410 is core and CS 4410 needs it. The only stand-in, CS 3420, needs ECE/ENGRD
      2300, which isn't in the plan, so it can't simply go.

- id: as-003-ba-math-prereq
  split: dev
  program: cs-as
  catalog_year: 2024-25
  entering: FA24
  graduating: SP28
  current: FA26
  max_credits: 18
  history: *as_history
  plan: *as_plan
  request:
    text: Add CS 4620 next fall.
    ops:
      - {op: add, course: CS 4620, term: FA27}
    constraints: {add: [{course: CS 4620, term: FA27}]}
  expected:
    outcome: feasible
    notes: >-
      CS 4620 needs "MATH 1910 or MATH 1120" and "MATH 2940 or MATH 2210"; the B.A. math
      (MATH 1120, MATH 2210) meets both, and it runs in fall.

