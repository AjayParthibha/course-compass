# Sources, checked 2026-10-19:
#  - the CS checklist (Arts) "for students matriculated in Fall 2020 or later", the
#    version before the Fall 2024 one, which the student confirmed applies to Fall 2023
#  - the 2023-24 Courses of Study (eCommons, hdl.handle.net/1813/114370.2), College of
#    Arts and Sciences, Computer Science, pp. 322-323
# Against 2024-25: a five-course core (no CS 3700/3780 slot), three CS electives, a
# required probability course, and the 2023-24 project list. Ids match the 2024-25 file
# so the UI and saved plans treat both alike.
id: cs-major-as
label: CS major (Arts & Sciences)
catalog_year: 2023-24
source_url: https://hdl.handle.net/1813/114370.2
verified: false
requirements:
  - id: intro
    label: Intro computing
    kind: all_of
    children:
      # checklist: "CS 1110, 1112, or 1115"; the catalog names 1110 or 1112
      - {id: intro-1110, label: CS 1110 or 1112, kind: courses, courses: [CS 1110, CS 1112, CS 1115], count: 1}
      - {id: intro-2110, label: CS 2110 or 2112, kind: courses, courses: [CS 2110, CS 2112], count: 1}

  # "MATH 1110 and MATH 1120 and MATH 2210, or MATH 1910 and MATH 1920 and MATH 2940"
  # (checklist: "MATH 1910-1920-2940 is also acceptable"): one sequence or the other
  - id: math
    label: Math
    kind: any_of
    children:
      - {id: math-as, label: "MATH 1110, 1120 and 2210", kind: courses, courses: [MATH 1110, MATH 1120, MATH 2210]}
      - {id: math-eng, label: "MATH 1910, 1920 and 2940", kind: courses, courses: [MATH 1910, MATH 1920, MATH 2940]}
    notes: >-
      AP and CASE credit stands in for the course it's recorded as. A mix of the two
      sequences isn't named by either source; check it with an advisor.

  # "One of: BTRY 3080, CS 4850, ECE 3100, ECON 3130, ENGRD 2700, MATH 4710" (BTRY 3080
  # cross-listed as STSCI 3080 and ILRST 3080; CS 4850 as CS 5850)
  - id: probability
    label: Probability
    kind: courses
    courses: [BTRY 3080, STSCI 3080, ILRST 3080, CS 4850, ECE 3100, ECON 3130, ENGRD 2700, MATH 4710]
    count: 1
    # the checklist counts STSCI 3080 as both the probability course and a technical elective
    double_count: [tech]
    notes: A 3000+ course is strongly recommended (checklist).

  - id: core
    label: CS core
    kind: all_of
    children:
      - {id: core-2800, label: CS 2800, kind: courses, courses: [CS 2800, CS 2802], count: 1}
      - {id: core-3110, label: CS 3110, kind: courses, courses: [CS 3110], count: 1}
      - {id: core-3410, label: CS 3410 or 3420, kind: courses, courses: [CS 3410, CS 3420], count: 1}
      - {id: core-4410, label: CS 4410 or 4414, kind: courses, courses: [CS 4410, CS 4414], count: 1}
      - {id: core-4820, label: CS 4820, kind: courses, courses: [CS 4820], count: 1}

  - id: e4000
    label: 4000+ CS electives
    kind: filter
    filter:
      subjects: [CS]
      min_level: 4000
      min_credits: 3
      exclude: [CS 4090, CS 4997, CS 4998, CS 4999]
      # CS 3700 and CS 3780 are the renumbered CS 4700 and CS 4780; the department's
      # checklist counts them here
      include: [CS 3700, CS 3780]
    count: 3
    notes: Three non-core CS 4000+ courses of 3+ credits; no double counting within the electives.

  - id: practicum
    label: Practicum or project
    kind: courses
    # the catalog ("CS 4xx1" practicums, 3152, 4152, 4740, 5150, 5412, 5414, 5625) plus
    # the checklist (adds 4154, 4752, 5152, 5431, 5643); CS 4xx1 = 4121, 4321, 4411,
    # 4621, 4701
    courses: [CS 3152, CS 4121, CS 4152, CS 4154, CS 4321, CS 4411, CS 4621, CS 4701, CS 4740, CS 4752, CS 5150, CS 5152, CS 5412, CS 5414, CS 5431, CS 5625, CS 5643]
    count: 1
    notes: At least 2 credits (catalog).

  - id: tech
    label: Technical electives
    kind: filter
    filter:
      # 3000+ courses of 3+ credits, but one 2000+ course is allowed (max_below_level)
      min_level: 2000
      min_credits: 3
      exclude: [CS 4090, CS 4997, CS 4998]
      qualifying_prereq:
        # "Any CS course of 3 or more credits, and at or above the 3000-level"
        exempt_subjects: [CS]
        # the catalog's qualifying corequisites or prerequisites, by course
        courses: [AEM 2100, AEM 2240, AEM 2241, BEE 2510, BEE 2600, BIOEE 1610, BIOEE 1780, BIOG 1445, BIOMG 2800, BIOMG 3300, BIOMG 3310, BIOMG 3320, BIOMG 3350, BIONB 2220, CEE 3040, CHEM 1560, CHEM 1570, CHEM 2070, CHEM 2090, CHEM 2150, CS 2110, CS 2112, CS 2800, CS 2802, ECON 3030, ECON 3040, ECON 3110, ECON 3120, ECON 3130, INFO 2300, INFO 2950, INFO 3300, LING 3302, LING 3303, MATH 1120, MATH 1910, MATH 1920, MATH 2210, MATH 2220, MATH 2240, MATH 2930, MATH 2940, ORIE 3300, ORIE 3500, PHIL 2310, PHYS 1112, PHYS 1116, PHYS 2207, PHYS 2208, PHYS 2213, PHYS 2214, PHYS 2217, PHYS 2218, PUBPOL 2100, PUBPOL 2101, STSCI 2100, STSCI 2200, STSCI 3080]
        subjects: [ENGRD]  # "or any ENGRD course"
        # "by course text": college-level biology, second-semester calculus, probability or
        # statistics named as a corequisite or prerequisite
        text_any: [college-level biology, second-semester calculus, probability, statistics]
        chain: true  # a requisite that itself has a qualifying requisite
    count: 3
    max_below_level: {3000: 1}
    notes: >-
      The checklist adds "only one of ENGRD 2700 or MATH 2930 accepted", which the one
      course below 3000 already covers. Up to two research courses may count (letter grade, 3+ credits; CS 4999 qualifies;
      other departments' research needs faculty confirmation): not modelled. Recommended
      prerequisites, and ones only on a syllabus, don't qualify; the text check reads the
      roster's prerequisite wording up to the word "recommended".

  - id: ext
    label: External specialization
    kind: filter
    filter:
      min_level: 3000
      exclude_subjects: [CS]
      min_credits: 3
      # no research, independent study, project team or teaching credit
      exclude_titles:
        - Independent Study
        - Independent Research
        - Individual Study
        - Undergraduate Research
        - Supervised Research
        - Directed Research
        - Directed Study
        - Directed Reading
        - Supervised Reading
        - Group Study
        - Honors Research
        - Honors Thesis
        - Thesis Research
        - Dissertation
        - Project Team
        - Special Project
        - Teaching in
        - Teaching Assistant
        - Teaching Experience
        - Supervised Teaching
        - Internship
      # named on the checklist as not accepted
      exclude: [LING 4474, INFO 3300, INFO 4300, INFO 5300]
    count: 3
    same_subject: true
    # the 2023-24 catalog says "a topic area other than computer science"
    approval: Three courses from different subjects on one topic, approved by my advisor
    notes: >-
      Three 3000+ courses of 3+ credits from one subject area (checklist) or topic area
      (catalog); CS courses and courses "parented by CS" don't count (the course data can't
      tell the latter apart), nor LING 4474, INFO 3300, INFO 4300 or INFO 5300.

  # id kept for existing plans; this is the major's elective, not the college's
  - id: aae
    label: Major-approved elective
    kind: filter
    # checklist: no PE, no courses numbered 10xx (which covers Engineering AEWs), no ROTC
    # courses unless cross-listed with an academic department
    filter: {min_level: 1100, exclude_subjects: [PE, AIRS, MILS, NAVS]}
    count: 1
    credits: 3
    notes: One course of 3+ credits or several totalling 3; S/U allowed; no AP/IB credit.
