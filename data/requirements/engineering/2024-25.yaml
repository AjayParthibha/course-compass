# College of Engineering rules as they apply to CS majors. Sources, checked 2026-10-19:
#  - the 2026-27 Courses of Study, Duffield College of Engineering graduation
#    requirements (on https://catalog.cornell.edu/programs/computer-science-bs/), and
#  - the CS department's checklist for students matriculated in Fall 2024 or later,
#    which gives CS's physics, chemistry and fourth-science rows.
# Physics and chemistry are taken to be the same for every cohort. Not modelled: "the
# total number of math and science credits must be >= 29" (the checklist's own rows add
# up to 27-28, so what else counts is unclear), letter grades and minimum grades.
id: engineering
label: College of Engineering
catalog_year: 2024-25
source_url: https://catalog.cornell.edu/programs/computer-science-bs/
verified: false
requirements:
  - id: eng-physics
    label: Physics
    kind: all_of
    children:
      - {id: eng-phys-mech, label: PHYS 1112 or 1116, kind: courses, courses: [PHYS 1112, PHYS 1116], count: 1}
      # the 1-credit lab; on the checklist and in the catalog's normal and honors programs
      - {id: eng-phys-lab, label: PHYS 1110 lab, kind: courses, courses: [PHYS 1110], count: 1}
      - {id: eng-phys-em, label: PHYS 2213 or 2217, kind: courses, courses: [PHYS 2213, PHYS 2217], count: 1}

  - id: eng-chem
    label: Chemistry
    kind: courses
    courses: [CHEM 2090]
    notes: From Fall 2025 the lab is a separate 1-credit course, CHEM 2091.

  # CS's fourth science, from the checklist: "CHEM 2080 or PHYS 2214", and "students can
  # substitute BTRY 3080, CHEM 2150, ECE 3100, ECON 3130, MATH 2930, MATH 4710, PHYS 2218"
  - id: eng-fourth-science
    label: Fourth science
    kind: courses
    courses: [CHEM 2080, PHYS 2214, BTRY 3080, CHEM 2150, ECE 3100, ECON 3130, MATH 2930, MATH 4710, PHYS 2218]
    count: 1

  # "Two engineering distribution (ENGRD) courses (6-8 credits) must be selected from two
  # different categories"; the categories and their courses are the catalog's
  - id: eng-distribution
    label: Engineering distribution
    kind: courses
    courses: [ENGRD 2110, ENGRD 2112, ENGRD 2140, ENGRD 3200, ENGRD 2610, ENGRD 2620, ENGRD 2020, ENGRD 2700, ENGRD 2720, ENGRD 2100, ENGRD 2300, ENGRD 2550, ENGRD 2111, ENGRD 2190, ENGRD 2210, ENGRD 2250, ENGRD 2400, ENGRD 2510, ENGRD 2600, ENGRD 2202, CHEM 3890, BIOMG 3300, BIOMG 3310, BIOMG 3350]
    count: 2
    groups:
      - {id: computing, label: Scientific computing, courses: [ENGRD 2110, ENGRD 2112, ENGRD 2140, ENGRD 3200]}
      - {id: materials, label: Materials science, courses: [ENGRD 2610, ENGRD 2620]}
      - {id: mechanics, label: Mechanics, courses: [ENGRD 2020]}
      - {id: probability, label: Probability and statistics, courses: [ENGRD 2700, ENGRD 2720]}
      - {id: electrical, label: Electrical sciences, courses: [ENGRD 2100, ENGRD 2300, ENGRD 2550]}
      - {id: thermo, label: Thermodynamics and energy balances, courses: [ENGRD 2111, ENGRD 2190, ENGRD 2210]}
      - {id: earth-life, label: Earth and life sciences, courses: [ENGRD 2250, ENGRD 2400, ENGRD 2510, ENGRD 2600]}
      - {id: bio-chem, label: Biology and chemistry, courses: [ENGRD 2202, CHEM 3890, BIOMG 3300, BIOMG 3310, BIOMG 3350]}
    min_groups: 2
    # CS 2110/2112 count here through their ENGRD cross-listing (the checklist's first
    # distribution row is "CS/ENGRD 2110 or 2112")
    double_count: [intro-2110]

  - id: eng-intro
    label: Intro to engineering (ENGRI)
    kind: filter
    filter: {subjects: [ENGRI]}
    count: 1
    # where the starter plan puts its slot, not a rule: part of the first-year curriculum
    seed: earliest

  - id: fws
    label: First-year writing seminars
    kind: filter
    filter: {title_prefix: "FWS:"}
    count: 2
    seed: earliest
    notes: Matched by roster title; every FWS title starts with "FWS:".

  - id: eng-comm
    label: Engineering communications
    kind: courses
    courses: [ENGRC 3023, ENGRC 3024, ENGRC 3025, ENGRC 3026, ENGRC 3027, ENGRC 3152, ENGRC 3340, ENGRC 3341, ENGRC 3350, ENGRC 3500, ENGRC 3600, ENGRC 3610, ENGRC 3700, ENGRC 4152, COMM 3020, COMM 3030, HADM 3670]
    count: 1
    # "Engineering-communication courses may simultaneously fulfill another requirement"
    double_count: [ls, aae, eng-aae]
    # but for these options the catalog says "this option does not count toward the
    # Liberal Studies requirement for engineers, even via petition"
    double_count_except:
      ls: [ENGRC 3023, ENGRC 3024, ENGRC 3341, ENGRC 3152, ENGRC 3610, ENGRC 4152, COMM 3020, COMM 3030, HADM 3670]
    notes: Writing- or communication-intensive courses in the major also qualify; ENGRC 3152 and 4152 pair with CS 3152 and 4152.

  - id: ls
    label: Liberal studies
    kind: filter
    filter:
      attributes_any: [CA-AG, CA-HE, LA-AG, LAD-HE, ALC-AS, ALC-AAP, ALC-HA, SCD-HA, SCD-AS, HA-AG, HA-HE, HST-AS, KCM-AG, KCM-HE, ETM-AS, ETM-HA, SBA-AG, SBA-HE, SSC-AS, SSC-AAP, SSC-HA, GLC-AS, GLC-HA, FL-AG, CE-EN, D-AG]
      min_credits: 3
    count: 6
    credits: 18
    double_count: [eng-comm]
    # the catalog's seven groups; a course in several is counted in one of them
    groups:
      - {id: g1, label: "Group 1: cultural analysis, literature and the arts", attributes_any: [CA-AG, CA-HE, LA-AG, LAD-HE, ALC-AS, ALC-AAP, ALC-HA, SCD-HA]}
      - {id: g2, label: "Group 2: historical analysis", attributes_any: [HA-AG, HA-HE, HST-AS]}
      - {id: g3, label: "Group 3: ethics, cognition and moral reasoning", attributes_any: [KCM-AG, KCM-HE, ETM-AS, ETM-HA]}
      - {id: g4, label: "Group 4: social science and global citizenship", attributes_any: [SBA-AG, SBA-HE, SSC-AS, SSC-AAP, SSC-HA, GLC-AS, GLC-HA]}
      - {id: g5, label: "Group 5: foreign languages", attributes_any: [FL-AG]}
      - {id: g6, label: "Group 6: communications in engineering", attributes_any: [CE-EN], max_courses: 2}
      - {id: g7, label: "Group 7: race and equity", attributes_any: [SCD-AS, D-AG], min_credits: 3}
    min_groups: 3
    min_at_level: {2000: 2}
    notes: >-
      Six courses, 18+ credits, from at least three of the seven groups, at least 3 credits
      from Group 7, at most two Group 6 courses, at least two at the 2000 level or higher.
      One-credit courses can't count.

  # "Courses must be >=1100 level"; "Some courses >=1100 cannot count toward the degree
  # such as MATH 1110 or MATH 1900 or CS 1109"; CS: PE and ROTC under 3000 don't count;
  # "Up to 6 credits of approved electives may come from ROTC courses at the 3000-level"
  - id: eng-aae
    label: Advisor-approved electives
    kind: filter
    filter:
      min_level: 1100
      exclude_subjects: [PE]
      exclude: [MATH 1110, MATH 1900, CS 1109]
      min_level_for: {AIRS: 3000, MILS: 3000, NAVS: 3000}
    count: 2
    credits: 6
    double_count: [eng-comm]
    notes: Approved by the faculty advisor; courses below where the curriculum starts (MATH 1110, CS 1109) don't count.

  - id: eng-pe
    label: Physical education
    kind: flag_only
    count: 2
    notes: Two semesters of PE (university requirement).

  - id: eng-swim
    label: Swim test
    kind: flag_only
    count: 1
    notes: Demonstrate proficiency in swimming (university requirement).
