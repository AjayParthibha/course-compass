name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-packages
      - run: uv run ruff check backend eval
      - run: uv run ruff format --check backend eval
      - run: uv run pytest backend
      - name: Eval smoke test
        working-directory: eval
        run: uv run python -m harness.run --mode validate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: uv sync --all-packages
      - name: API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build
