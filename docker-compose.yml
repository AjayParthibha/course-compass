services:
  api:
    build:
      context: .
      target: dev
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  web:
    image: node:22-slim
    working_dir: /app/web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./web:/app/web
      - node_modules:/app/web/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  node_modules:
